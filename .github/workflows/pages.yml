# main 브랜치에 올라오면 flight-focus 폴더를 GitHub Pages로 배포
# (한 번만: 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정)
name: Deploy Focus Air to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flight-focus
      - id: deployment
        uses: actions/deploy-pages@v4
